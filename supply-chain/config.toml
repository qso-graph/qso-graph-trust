
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/rust-crate-audits/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.qso-graph-trust]
audit-as-crates-io = false

[policy.qso-graph-trust-awslc]
audit-as-crates-io = false

[policy.qso-graph-trust-cli]
audit-as-crates-io = false

[policy.xtask]
criteria = "safe-to-run"

[[exemptions.equivalent]]
version = "1.0.3"
criteria = "safe-to-run"

[[exemptions.fs_extra]]
version = "1.3.0"
criteria = "safe-to-deploy"
notes = "Not audited yet (decision 0004): a build tool for AWS-LC (file copying, via aws-lc-sys); runs only while AWS-LC is built, never shipped."

[[exemptions.generic-array]]
version = "0.14.7"
criteria = "safe-to-deploy"
notes = "Not audited yet (decision 0004): fixed-size arrays under RustCrypto's digest and cipher crates."

[[exemptions.hashbrown]]
version = "0.17.1"
criteria = "safe-to-run"

[[exemptions.indexmap]]
version = "2.14.2"
criteria = "safe-to-run"

[[exemptions.memchr]]
version = "2.8.3"
criteria = "safe-to-run"

[[exemptions.num-bigint-dig]]
version = "0.8.6"
criteria = "safe-to-run"
notes = "Not audited yet (docs/decisions/0004-supply-chain.md): rsa's big-number library. The code rsa's signing reaches (Montgomery exponentiation, multiplication, division, inverse, blinding randomness, build.rs) was reviewed by Codex (gpt-6-astra, high) on 2026-11-03 and found safe-to-deploy; the rest of the crate is not reviewed. Known: an assertion message at src/monty.rs:50 would print its operands, a secret prime included, if it ever failed (no normal path does; Gate C's custody test covers it)."

[[exemptions.r-efi]]
version = "6.0.0"
criteria = "safe-to-deploy"
notes = "Not audited yet (decision 0004): getrandom 0.4's UEFI back end, never built for QG Trust's platforms (Windows, macOS, Linux)."

[[exemptions.serde_spanned]]
version = "1.1.2"
criteria = "safe-to-run"

[[exemptions.spin]]
version = "0.9.9"
criteria = "safe-to-run"
notes = "Not audited yet (decision 0004): reached only through lazy_static's no-std option, for num-bigint-dig."

[[exemptions.tls_codec]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Never compiled (Bob, 2026-11-03): in Cargo.lock only as x509-cert's optional dependency for its sct feature, which QG Trust does not enable; absent from cargo tree --all-features and from every build."

[[exemptions.tls_codec_derive]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Never compiled (Bob, 2026-11-03): tls_codec's derive macros; see tls_codec."

[[exemptions.toml]]
version = "1.1.8+spec-1.1.0"
criteria = "safe-to-run"

[[exemptions.toml_datetime]]
version = "1.1.2+spec-1.1.0"
criteria = "safe-to-run"

[[exemptions.toml_parser]]
version = "1.1.5+spec-1.1.0"
criteria = "safe-to-run"

[[exemptions.toml_writer]]
version = "1.1.3+spec-1.1.0"
criteria = "safe-to-run"

[[exemptions.typenum]]
version = "1.20.1"
criteria = "safe-to-deploy"
notes = "Not audited yet (decision 0004): type-level numbers for RustCrypto's generic-array; mostly generated tables, holds no data at run time."

[[exemptions.wasi]]
version = "0.11.1+wasi-snapshot-preview1"
criteria = "safe-to-deploy"
notes = "Not audited yet (decision 0004): getrandom's WebAssembly back end, never built for QG Trust's platforms (Windows, macOS, Linux)."

[[exemptions.winnow]]
version = "1.0.4"
criteria = "safe-to-run"
