[[audits.miniz_oxide]]
who = "Bob, agent for KI7MT"
criteria = "safe-to-deploy"
delta = "0.8.9 -> 0.9.1"
notes = "Reviewed by Bob, 2026-11-03: compression changes in safe code (new flush modes, window-bits limits, a halved distance table, Clone derives); the crate stays #![forbid(unsafe_code)], with no build script and no file, network or process access. QG Trust round-trips its output in tests and gzip -t accepts it."

