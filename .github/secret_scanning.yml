# Test keys, made from test certificates for the call QG0TEST, which nothing real trusts
# (tests/corpus/README.md). Named one by one, never a folder or a pattern, so a real key
# committed anywhere else is still caught.
paths-ignore:
  - "tests/corpus/pki/user-1024.key.pem"
  - "tests/corpus/pki/user-1024-aes.p12"
  - "tests/corpus/pki/user-1024-legacy.p12"
  - "tests/corpus/tqsl/pki/root.key"
  - "tests/corpus/tqsl/pki/ca.key"
  - "tests/corpus/tqsl/1024/tqsl/keys/QG0TEST"
  - "tests/corpus/tqsl/1024/QG0TEST.p12"
  - "tests/corpus/tqsl/1024/QG0TEST-weak.p12"
  - "tests/corpus/tqsl/1024/QG0TEST-no-password.p12"
  - "tests/corpus/tqsl/1024-password/tqsl/keys/QG0TEST"
  - "tests/corpus/tqsl/1024-password/QG0TEST.p12"
  - "tests/corpus/tqsl/1024-password/QG0TEST-weak.p12"
  - "tests/corpus/tqsl/1024-password/QG0TEST-no-password.p12"
  - "tests/corpus/pki/user-1024-pbkdf2-sha1.key.pem"
  - "tests/corpus/roots/user-a.p12"
