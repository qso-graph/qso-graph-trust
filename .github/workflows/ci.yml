# SPDX-License-Identifier: GPL-3.0-or-later
# CI for QSO Graph Trust. A pull request's run is the one check of a change,
# so a merge into main runs nothing. Once a week main is checked again,
# so a newly published advisory against a locked crate fails even when nothing
# changed. ci-all-green, the name every qso-graph repository uses, is the one
# result a merge waits for.
name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting, lints and tests, on each platform the library ships for: its
  # dependency tree differs per platform (the OS credential stores), so each is built.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's own commit, not GitHub's merge of it: what release.yml publishes
          # is proved by a run of exactly the commit whose files main holds.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # rust-toolchain.toml names the version; rustup installs it here.
      - name: Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: cargo fmt
        run: cargo fmt --all --check
      # Every feature, so no code hides behind one the default build leaves out
      # (found in review).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked
      # Linux gets a Secret Service of its own (gnome-keyring, unlocked with a throwaway password)
      # before the tests: the custody test runs qg-trust against one to search all it writes, and
      # the round trip below uses one. macOS and Windows use the runner's own store.
      - name: Secret Service (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring dbus-x11
      - name: cargo test
        run: cargo test --workspace --all-features --locked
      # ADIF's published test logs are fetched rather than redistributed: their terms are unclear.
      # The archive is pinned by SHA-256 and cached under it, so adif.org.uk is asked once, not on
      # every run.
      - name: ADIF published archive (cache)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/adif-cache
          key: adif-317-1a70caf3a152c67c23ce9c4681f24b8e5f814862d8153d9a72e741375358e6d9
      - name: ADIF published ADI and ADX test files
        if: runner.os == 'Linux'
        shell: bash
        env:
          QGT_ADIF_TEST_DIR: ${{ runner.temp }}/adif/317/tests
        run: |
          archive="$HOME/adif-cache/ADIF_317_resources_2026_03_22.zip"
          if [ ! -f "$archive" ]; then
            mkdir -p "$HOME/adif-cache"
            curl --fail --location --silent --show-error https://adif.org.uk/317/ADIF_317_resources_2026_03_22.zip --output "$archive"
          fi
          echo "1a70caf3a152c67c23ce9c4681f24b8e5f814862d8153d9a72e741375358e6d9  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/adif"
          unzip -q "$archive" '317/tests/ADIF_317_test_QSOs_2026_03_22.adi' '317/tests/ADIF_317_test_QSOs_2026_03_22.adx' -d "$RUNNER_TEMP/adif"
          cargo test -p qso-graph-trust --lib --all-features --locked adx::tests::published_adi_and_adx_samples -- --exact --nocapture
      # The OS credential store itself, under the test service only: what keyring writes must be
      # what presence and listing find.
      - name: OS credential store round trip
        shell: bash
        env:
          QGT_OS_KEYSTORE_TEST: '1'
        run: |
          test='store::tests::os::os_round_trip_uses_only_test_service_and_reports_lost_and_orphaned_keys'
          run="cargo test -p qso-graph-trust --lib --all-features --locked $test -- --ignored --exact"
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -c "echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; $run" | tee "$RUNNER_TEMP/os.log"
          else
            $run | tee "$RUNNER_TEMP/os.log"
          fi
          # A filter that matched nothing would pass with 0 tests: the one test must have run.
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/os.log"
      # In this job's own environment: a crate using unsafe code must be refused.
      - name: canary
        run: cargo xtask canary

  # The repository's own rules: no C in the library's tree on any platform, no
  # unsafe code, and no known vulnerability in a locked crate.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's own commit, not GitHub's merge of it: what release.yml publishes
          # is proved by a run of exactly the commit whose files main holds.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo xtask policy
        run: cargo xtask policy
      # The custody test optimised: optimisation is what removes a wipe, and the
      # check jobs run it in debug (Linux only: it reads a child's memory through /proc).
      # Its search of what qg-trust writes starts a Secret Service of its own (gnome-keyring).
      - name: Secret Service for the custody test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring dbus-x11
      - name: custody test, release
        run: cargo test -p qso-graph-trust-custody --release --locked
      # LoTW's tables are generated from ARRL's configuration, never edited by hand, and the crate
      # carries ARRL's terms unchanged.
      - name: LoTW tables match config.xml
        run: python3 scripts/gen-lotw-tables.py --check
      # Each published crate carries the GPL's text and the notices, as the repository has them.
      - name: Package files match the repository's
        run: python3 scripts/package-files.py --check
      # docs/TQSLLIB-MAP.md: each of tqsllib 2.8.7's 215 names mapped to Rust, a command and a test
      # that exist, or given a reason. tqsllib's source is ARRL's and never here, so the names are
      # held by their pinned SHA-256; --tqsl-src compares them with the headers where it is at hand.
      - name: tqsllib map
        run: |
          python3 scripts/tqsllib-map.py --check
          python3 scripts/tqsllib-map.py --self-test
      # The release's decisions, each with the cases it must refuse.
      - name: Release checks
        run: python3 scripts/test_release_check.py
      # What crates.io would receive, built from the packages alone, in publishing order.
      - name: cargo package
        run: cargo package -p qso-graph-trust-awslc -p qso-graph-trust -p qso-graph-trust-cli --locked
      - name: canary
        run: cargo xtask canary
      # Every outside crate reviewed: audits recorded in supply-chain/, imported
      # from Mozilla, Google, the Bytecode Alliance and Zcash, or a trusted
      # publisher (docs/decisions/0004).
      - name: cargo vet
        run: |
          cargo install cargo-vet --version 0.10.3 --locked --quiet
          cargo vet --locked
      # Where crates come from, which may not appear, and licences (deny.toml).
      - name: cargo deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked --quiet
          cargo deny --locked check bans licenses sources
      # An exact release: --locked pins its dependencies, not which release
      # runs, so without --version a new one would run unreviewed (found in review).
      - name: cargo audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --quiet
          cargo audit --file Cargo.lock
      # .cargo/audit.toml ignores one advisory, RUSTSEC-2023-0071, because rsa has no fixed release
      # (docs/decisions/0002). Once it has one, this fails, so the exception cannot outlive its reason.
      - name: The audit exception is still needed
        run: |
          f="${CARGO_HOME:-$HOME/.cargo}/advisory-db/crates/rsa/RUSTSEC-2023-0071.md"
          [ -f "$f" ] || { echo "RUSTSEC-2023-0071 is not in the advisory database cargo audit fetched" >&2; exit 1; }
          if ! grep -qx 'patched = \[\]' "$f"; then
            echo "rsa now has a fixed release for RUSTSEC-2023-0071: upgrade it and remove the ignore in .cargo/audit.toml" >&2
            exit 1
          fi
          echo "RUSTSEC-2023-0071: still no fixed release; the exception stands"

  # Coverage-guided fuzzing of the file readers (docs/decisions/0012-fuzzing.md): cargo fuzz and
  # libFuzzer, on the dated nightly fuzz/rust-toolchain.toml names, for the fuzz binaries alone;
  # everything that ships is built by the pinned stable in the jobs above. Each target runs 60
  # seconds on a pull request and 10 minutes on the weekly run, from seeds copied out of
  # tests/corpus. A crash, a hang or a broken invariant fails the job, and its input is kept.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # fuzz/rust-toolchain.toml names the nightly; rustup installs it here. An exact cargo-fuzz:
      # --locked pins its dependencies, --version which release runs.
      - name: Rust nightly and cargo-fuzz
        working-directory: fuzz
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-fuzz --version 0.13.2 --locked --quiet
      # The fuzzers' own Rust is formatted and linted like the workspace's. --locked here also holds
      # cargo fuzz, which has no such flag, to fuzz/Cargo.lock: a change to it fails this step first.
      - name: cargo fmt and clippy (fuzz)
        working-directory: fuzz
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
      - name: Seed the corpora from tests/corpus
        run: fuzz/seed.sh
      - name: Build every target
        working-directory: fuzz
        run: cargo fuzz build
      - name: Fuzz every target
        working-directory: fuzz
        env:
          SECONDS_EACH: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: |
          for target in $(cargo fuzz list); do
            case "$target" in adif|adx) len=16384 ;; *) len=65536 ;; esac
            cargo fuzz run "$target" -- -max_total_time="$SECONDS_EACH" -max_len="$len" \
              -timeout=20 -rss_limit_mb=4096 -print_final_stats=1
          done
      - name: Keep what was found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Exercise the exact release build and archive steps before merging. No signing environments
  # or secrets are passed; the reusable workflow signs only when its sign input is true.
  binaries:
    name: binaries
    permissions:
      contents: read
      # The reusable workflow declares these for its release-only signing and attestation steps.
      id-token: write
      attestations: write
    uses: ./.github/workflows/binaries.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      sign: false

  ci-all-green:
    name: ci-all-green
    needs: [check, policy, fuzz, binaries]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job did not pass: $r"; exit 1; }; done
