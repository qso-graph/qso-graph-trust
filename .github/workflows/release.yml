# SPDX-License-Identifier: GPL-3.0-only
# Release: publish QSO Graph Trust's library and its binding on crates.io, then tag the commit.
# Run by hand (Actions -> Release -> Run workflow) from main, with the version main already says:
# a release, X.Y.Z, or a beta, X.Y.Z-beta.N (decision 0007). It refuses, before anything is
# published, unless main's files are exactly those a green pull request run checked. The tag is cut
# only after crates.io has both crates, so a tag means published. A run that stopped halfway is
# finished by running it again: what is already published must be exactly this commit's package,
# and a tag already cut must be on this commit. Each decision is scripts/release_check.py's, tested
# by scripts/test_release_check.py.
#
# crates.io's Trusted Publishing gives this run a short-lived token for exactly these crates, so no
# token is stored. A crate's very first publish cannot use it, because Trusted Publishing is set up
# on a crate that exists: for that one run the crates-io Environment holds CRATES_IO_FIRST_PUBLISH,
# a token scoped to these two crates, removed once Trusted Publishing is set up.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, such as 0.1.0-beta.1 or 0.1.0: main must already say it'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: What may be published
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$REF" = refs/heads/main ] || fail "Release runs from main, not ${REF}."
          python3 scripts/release_check.py version "$VERSION"
          said=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "qso-graph-trust") | .version')
          [ "$said" = "$VERSION" ] || fail "main says ${said}, not ${VERSION}."
          python3 scripts/gen-lotw-tables.py --check
          python3 scripts/package-files.py --check
          sha=$(git rev-parse HEAD)
          # A tag already there must be on this commit: a release half done is finished, never moved.
          python3 scripts/release_check.py tag "$REPO" "$VERSION" "$sha" >/dev/null
          # A merge runs no CI, so main's commit has none of its own: what proves it is a green pull
          # request run of this repository's CI whose own commit holds exactly main's files.
          proved=$(python3 scripts/release_check.py proving-run "$REPO" "$(git rev-parse 'HEAD^{tree}')")
          echo "main ${sha} holds exactly what pull request run of ${proved} checked."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Environment admits main only; it, not this file, is the lock.
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      # Whether this is a crate's first publish, set by the Environment's secret; never the token itself.
      FIRST_PUBLISH: ${{ secrets.CRATES_IO_FIRST_PUBLISH != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Rust
        run: rustup show active-toolchain || rustup toolchain install
      - id: trusted
        name: crates.io token (Trusted Publishing)
        if: ${{ env.FIRST_PUBLISH != 'true' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Package the binding and the library
        run: cargo package -p qso-graph-trust-awslc -p qso-graph-trust --locked
      # One at a time, the binding first. A crate crates.io already has at this version is accepted
      # only if it is exactly this commit's package, so a release that stopped halfway is finished
      # by running it again.
      - name: Publish the binding, then the library
        env:
          VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.trusted.outputs.token || secrets.CRATES_IO_FIRST_PUBLISH }}
        run: |
          set -euo pipefail
          for crate in qso-graph-trust-awslc qso-graph-trust; do
            state=$(python3 scripts/release_check.py crate "$crate" "$VERSION" "target/package/${crate}-${VERSION}.crate")
            if [ "$state" = same ]; then echo "crates.io already has ${crate} ${VERSION}, exactly this package."; continue; fi
            cargo publish -p "$crate" --locked
          done
      - name: Tag the published commit
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Asked again here, not trusted from the check job: a tag made meanwhile, anywhere but this
          # commit, fails the release rather than being reported as this one.
          if [ "$(python3 scripts/release_check.py tag "$REPO" "$VERSION" "$SHA")" = absent ]; then
            gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/v${VERSION}" -f "sha=${SHA}" >/dev/null
          fi
          [ "$(python3 scripts/release_check.py tag "$REPO" "$VERSION" "$SHA")" = same ]
          echo "Published ${VERSION} on crates.io and tagged v${VERSION} at ${SHA}."
