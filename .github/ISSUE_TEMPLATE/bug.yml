name: Bug
description: Observed behaviour that is wrong.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach a real certificate, private key, `.p12`, `.tbk`, password or log of real QSOs.
        Use the test certificates in `tests/corpus`, or describe the file's shape.
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Library
        - CLI (qg-trust)
        - App
        - QSO Graph Desktop integration
        - Repository, CI or docs
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened, and what should have happened. State what is established and what is only suspected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Steps, with test certificates and generated logs only.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How we know it is done. Each item is checkable.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Credentials
      options:
        - label: No real certificate, private key, password, token or real QSO log appears in this issue or its evidence.
          required: true
