# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "qso-graph-trust"
description = "Sign ADIF logs for ARRL's Logbook of The World (LoTW)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lotw", "arrl", "ham-radio", "amateur-radio", "adif"]
categories = ["cryptography", "parser-implementations"]
# What the package holds, and nothing else: a new file in this folder does not reach crates.io until
# it is named here. The tests read this repository's corpus, so they stay here.
include = ["src/**/*.rs", "README.md", "LICENSE.md", "LICENSE-ARRL.md", "NOTICE.md", "AUTHORS.md"]

# The key, signing and every file parser live in this crate, so its dependency
# tree holds no C or C++ but the one cryptographic provider, AWS-LC, reached
# only through the binding; `cargo xtask policy` fails the build otherwise
# (docs/decisions/0002-no-c-in-the-library.md, as amended, and 0006).
# Every one is pinned exactly: they are the key and signing path.
[dependencies]
# LoTW's signature, RSA PKCS#1 v1.5 with SHA-1, from AWS-LC through QG Trust's
# one binding (decision 0006).
qso-graph-trust-awslc = { path = "../qso-graph-trust-awslc", version = "=0.1.6" }
sha1 = { version = "=0.10.6", default-features = false, features = ["oid"] }
# Parse keys and DER only; protected-key parameters are decoded locally without crypto features.
# Derivation and decryption use the binding's safe AWS-LC API.
pkcs8 = { version = "=0.10.2", default-features = false, features = ["std", "pem"] }
# The LoTW certificate a signed log carries: its callsign, DXCC entity, QSO dates and public key.
x509-cert = { version = "=0.2.5", default-features = false, features = ["pem", "std"] }
# The .tq8: a signed log, gzipped. Deflate only; the gzip wrapper is ours (signed_log.rs).
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
# Every buffer that can hold a key is wiped when it is dropped.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
# Test tools only, never shipped: rsa and num-bigint-dig build the crafted keys the tests refuse.
[dev-dependencies]
# Independent test oracles and crafted encrypted envelopes only; never shipped crypto paths.
sha2 = { version = "=0.10.9", default-features = false, features = ["oid"] }
pkcs8 = { version = "=0.10.2", default-features = false, features = ["encryption", "3des", "sha1-insecure"] }
rsa = { version = "=0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15", "getrandom"] }
getrandom = "=0.4.3"
sha1-test = { package = "sha1", version = "=0.11.0", features = ["oid"] }
pkcs1-test = { package = "pkcs1", version = "=0.7.5", features = ["pkcs8"] }
num-bigint-dig = { version = "=0.8.6", default-features = false, features = ["prime"] }
# The README's example installs the wiping allocator, as every program that signs must.
zeroizing-alloc = { version = "=0.1.1", default-features = false }

[lints]
workspace = true

# The OS credential store: the same crate and version as QSO Graph Desktop's credential core
# (packages/callsign-core), so both use one implementation of the same store.
[dependencies.keyring]
version = "=4.2.0"

# Metadata-only presence and enumeration, using Desktop's platform APIs. Secrets still go
# through keyring's default backends; these are already in its locked dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
secret-service = { version = "=5.2.0", features = ["crypto-rust"] }
