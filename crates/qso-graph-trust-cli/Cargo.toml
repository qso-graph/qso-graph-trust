# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "qso-graph-trust-cli"
description = "qg-trust: sign and upload your logs for ARRL's Logbook of The World (LoTW), with your key in your computer's credential store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lotw", "arrl", "ham-radio", "amateur-radio", "tqsl"]
categories = ["command-line-utilities"]
# What the package holds, and nothing else. The tests read this repository's corpus.
include = ["src/**/*.rs", "README.md", "LICENSE.md", "NOTICE.md", "AUTHORS.md"]

# The command is qg-trust: QSO Graph's commands are qg-<word> (qg-trust, qg-rig,
# qg-interop, qg-sim), never a short one that can collide, while every package a
# registry carries is a full qso-graph-* name.
[[bin]]
name = "qg-trust"
path = "src/main.rs"

[dependencies]
qso-graph-trust = { path = "../qso-graph-trust", version = "=0.2.2" }
# Every block is wiped when it is freed, whichever library allocated it, so no key data is left
# in freed memory (AGENTS.md; cargo xtask policy requires it in every program).
zeroizing-alloc = { version = "=0.1.1", default-features = false }
# Wipes the password buffer when it is dropped, beside the allocator's wiping of freed memory.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
# The key's password, asked for at the terminal with what is typed hidden. It sets the terminal
# through the OS's own calls (libc on Unix, windows-sys on Windows) and holds no C.
rpassword = { version = "=7.5.4", default-features = false }
# The command line itself: its options, help and errors, styled at a terminal and plain otherwise.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "color", "wrap_help"] }
# Shell completions for qg-trust, written by --completions.
clap_complete = { version = "=4.6.11", default-features = false }
# qg-trust's own messages, styled as clap's are, and plain when they go to a file, a logger or NO_COLOR.
anstream = { version = "=1.0.0", default-features = false, features = ["auto", "wincon"] }
anstyle = { version = "=1.0.14", default-features = false, features = ["std"] }
# The upload to LoTW: HTTPS only, the certificate and host name always verified against Mozilla's
# roots (webpki-roots, built in, so it is the same on every computer), with AWS-LC, the provider
# the library already uses, as rustls's cryptography. The library opens no connection; this is the
# command line's one (docs/decisions/0002: the command line carries the TLS stack).
ureq = { version = "=3.5.1", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

[lints]
workspace = true
