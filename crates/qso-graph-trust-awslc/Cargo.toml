# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "qso-graph-trust-awslc"
description = "QSO Graph Trust's one binding to AWS-LC: LoTW's RSA-SHA-1 signature and certificate checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lotw", "arrl", "ham-radio", "aws-lc"]
categories = ["cryptography"]
include = ["src/**/*.rs", "README.md", "LICENSE.md", "NOTICE.md", "AUTHORS.md"]

# The only crate in QSO Graph Trust allowed unsafe code, and only to call AWS-LC's C functions for the
# key (docs/decisions/0006). aws-lc-rs's safe API does not sign RSA with SHA-1,
# which LoTW requires, so this calls RSA_sign itself. Pinned exactly: it is the signing path.
[dependencies]
aws-lc-sys = { version = "=0.45.0", default-features = false, features = ["all-bindings"] }
# AWS-LC's safe Rust API, as QSO Graph Desktop ships it (1.18.1, over the same aws-lc-sys): the
# signature checks on certificates, which it offers; only LoTW's SHA-1 signing, which it does not,
# goes through aws-lc-sys here.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys"] }

# Already used throughout the workspace: generated keys and derived encryption keys are always wiped.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# Not the workspace's lints, whose forbid(unsafe_code) cannot be lifted: the same ones, with unsafe
# denied rather than forbidden, so each unsafe block carries its own allow and its SAFETY reason.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
