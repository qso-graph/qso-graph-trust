# Planted cases for the policy checks (xtask/tests/planted.rs). Read by
# `cargo metadata` only: never compiled, never part of QGT.
[workspace]
members = ["protected", "native", "no-forbid", "no-lints"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
