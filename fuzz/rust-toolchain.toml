# The fuzzers' compiler, and theirs only: libFuzzer's coverage instrumentation needs a nightly
# (docs/decisions/0012-fuzzing.md). A dated nightly, so every run builds with the same one. The
# repository's root rust-toolchain.toml, an exact stable, still builds everything that ships.
[toolchain]
channel = "nightly-2026-10-30"
profile = "minimal"
components = ["rustfmt", "clippy"]
